<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <!-- melo mark: a light grey disc on black with a bold serif lowercase "m" laid over it.
       The letter is wider than the disc, so its right side crosses the disc's edge and runs
       out onto the black — the disc reads as cut through by the "m". Desktop assets are
       rasterised from this file; the Android launcher drawables (res/drawable/ic_mark_*.xml)
       use the same 108x108 geometry. -->
  <rect width="108" height="108" fill="#000000"/>
  <circle cx="54" cy="54" r="31" fill="#DCDCDC"/>

  <!-- Letter body: a square-topped stem with two arch humps dipping between them, and long
       thin slit counters that leave only hairline joins at the stems (even-odd holes). -->
  <path fill="#000000" fill-rule="evenodd" d="M42.5,67 V43.5
    C46,39 57,38 65,51.5
    C73,38 84,39 87,44.5
    V67 Z
    M52.4,53 H65.6 A1.2,1.2 0 0 1 65.6,55.4 H52.4 A1.2,1.2 0 0 1 52.4,53 Z
    M70.6,53 H83.6 A1.2,1.2 0 0 1 83.6,55.4 H70.6 A1.2,1.2 0 0 1 70.6,53 Z"/>

  <!-- Serif feet at the baseline. -->
  <g fill="#000000">
    <path d="M41.5,64.5 H48 V67 H41.5 Z"/>
    <path d="M60,64.5 H70 V67 H60 Z"/>
    <path d="M84,64.5 H89 V67 H84 Z"/>
  </g>
</svg>
