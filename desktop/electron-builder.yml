appId: com.hakosworld.melo
productName: melo
copyright: MIT

directories:
  output: dist
  buildResources: build

# Only the Electron entry point lives in the asar. The engine is executed as a
# Node process, so it and the built renderer ship as unpacked resources.
files:
  - main.js
  - package.json

extraResources:
  - from: engine/server.cjs
    to: engine/server.cjs
  - from: dist-renderer
    to: renderer
  # Optional: a bundled yt-dlp, if the release build provides one.
  - from: bin
    to: bin
    filter:
      - "**/*"

asar: true
compression: normal

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: melo-${version}-windows-x64-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: melo
  uninstallDisplayName: melo

linux:
  icon: build/icon.png
  category: Audio
  synopsis: Free, ad-free music player
  description: melo is a free, ad-free, account-free music app that streams a live catalogue with synced lyrics, downloads and playlists.
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: melo-${version}-linux-x64.${ext}
