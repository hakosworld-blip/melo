name: Build · Test · Release APK

# Manual trigger: Actions tab -> "Build · Test · Release APK" -> Run workflow.
# You choose the release tag, version number and whether it is a pre-release.

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0) — GitHub Release only, no Play Store"
        required: true
        type: string
      version:
        description: "Version number (e.g. 1.2.0), written to mobile/app.json"
        required: true
        type: string
      build_number:
        description: "Android versionCode (must always increment). No Play Store ever runs from this workflow."
        required: true
        default: "1"
        type: string
      prerelease:
        description: "Mark this GitHub Release as a pre-release. No Play Store runs from this workflow."
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # needed to create GitHub Releases

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

  build-and-release:
    name: Build, sign & release APK
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (dependency + wrapper cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Dependency and wrapper downloads are cached across runs; that is the
          # expensive part of this job. The signed APK itself is always built in
          # this run — see the build step for why.
          cache-read-only: false
          validate-wrappers: false

      - name: Install dependencies
        run: npm ci

      - name: Stamp version into app.json
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.expo.version=process.env.VERSION_NAME; j.expo.android.versionCode=Number(process.env.VERSION_CODE); fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');"
        env:
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.build_number }}

      - name: Verify the version stamp
        # Gradle reads mobile/app.json; fail here rather than shipping a stale
        # version inside the APK.
        env:
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.build_number }}
        run: |
          node -e "
          const app = require('./app.json');
          const wantName = process.env.VERSION_NAME;
          const wantCode = Number(process.env.VERSION_CODE);
          const gotName = app.expo.version;
          const gotCode = Number(app.expo.android.versionCode);
          if (gotName !== wantName || gotCode !== wantCode) {
            console.error('::error::app.json was not stamped: got ' + gotName + ' / ' + gotCode + ', expected ' + wantName + ' / ' + wantCode);
            process.exit(1);
          }
          console.log('app.json is stamped ' + gotName + ' (' + gotCode + ')');
          "

      - name: Detect changes (code, added & deleted files)
        # Fails the run if no file changes are present after the version stamp.
        # Prints added/modified/deleted files so the reason is visible in logs.
        run: |
          set -euo pipefail
          echo "=== git status (porcelain) ==="
          git status --porcelain
          echo
          echo "=== changed files (name-status vs HEAD) ==="
          git diff --name-status HEAD || true
          echo
          echo "=== diff stat ==="
          git diff --stat HEAD || true
          echo
          CHANGED=$(git status --porcelain | wc -l)
          if [ "$CHANGED" -eq 0 ]; then
            echo "::error::No file changes detected after the app build/version stamp. Expected at least the version-stamped app.json (and any source changes) to be present. Aborting: nothing to release."
            exit 1
          fi
          echo "Detected $CHANGED changed file(s). Proceeding."

      - name: Decode release keystore from secrets
        # Requires repo secret KEYSTORE_BASE64: `base64 -w 0 melo-release.jks`
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set on this repository. Run: base64 -w 0 melo-release.jks"
            exit 1
          fi
          rm -f android/app/melo-release.jks
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/melo-release.jks
          ls -lh android/app/melo-release.jks
          keytool -list -keystore android/app/melo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "keystore opens and alias \"$KEY_ALIAS\" exists"

      - name: Write android/key.properties from secrets
        # Requires secrets: KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for value in KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!value}" ]; then echo "::error::secret $value is not set"; exit 1; fi
          done
          {
            echo 'storeFile=melo-release.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "key.properties written for alias $KEY_ALIAS"

      - name: Build signed release APK (Gradle)
        # -PmeloRequireReleaseSigning makes Gradle fail instead of quietly
        # signing the release with the public debug key.
        run: |
          cd android
          # A restored Gradle cache must never supply the APK we are about to
          # publish: delete any previous outputs so this run signs its own.
          rm -rf app/build/outputs/apk/release
          # --no-build-cache on purpose: a cached packaging/signing task could
          # hand back an APK signed with a previous keystore after a rotation,
          # which is exactly the mismatch the verify step then reports.
          ./gradlew app:assembleRelease -PmeloRequireReleaseSigning=true --no-build-cache --stacktrace

      - name: Detect changes after build (code, added & deleted files)
        # Second check: ensure the Gradle build itself did not leave the tree
        # clean in a way that hides missing work; fail if nothing changed.
        run: |
          set -euo pipefail
          echo "=== git status (porcelain) ==="
          git status --porcelain
          echo
          echo "=== changed files (name-status vs HEAD) ==="
          git diff --name-status HEAD || true
          echo
          CHANGED=$(git status --porcelain | wc -l)
          if [ "$CHANGED" -eq 0 ]; then
            echo "::error::No file changes detected after the Gradle build. Expected version-stamped app.json and any source changes. Aborting: nothing to release."
            exit 1
          fi
          echo "Detected $CHANGED changed file(s) after build. Proceeding."

      - name: Verify signature and version of the built APK
        env:
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.build_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK was not produced"; exit 1; }

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in the Android SDK"; exit 1; }
          CERT_FILE=/tmp/apk-certs.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee "$CERT_FILE"
          if grep -qi 'CN=Android Debug' "$CERT_FILE"; then
            echo "::error::APK is signed with the debug key, not your release keystore"
            exit 1
          fi

          # keytool prints the fingerprint uppercase and colon-separated
          # (C2:06:53:...) while apksigner prints it lowercase without
          # separators (c20653...). Normalise both sides before comparing —
          # comparing the raw strings is what failed here before.
          normalise() { tr -d ':\n\r\t ' | tr '[:upper:]' '[:lower:]'; }

          RELEASE_SHA=$(keytool -list -v -keystore android/app/melo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -m1 -E '^[[:space:]]*SHA256:' \
            | sed 's/.*SHA256:[[:space:]]*//' | normalise)
          APK_SHA=$(grep -m1 -i 'certificate SHA-256 digest:' "$CERT_FILE" \
            | sed 's/.*digest:[[:space:]]*//' | normalise)

          if [ -z "$RELEASE_SHA" ]; then
            echo "::error::Could not read a SHA-256 fingerprint from the release keystore (alias $KEY_ALIAS)."
            exit 1
          fi
          if [ -z "$APK_SHA" ]; then
            echo "::error::Could not read a SHA-256 fingerprint from the APK."
            exit 1
          fi
          echo "keystore SHA-256: $RELEASE_SHA"
          echo "apk SHA-256:      $APK_SHA"
          if [ "$RELEASE_SHA" != "$APK_SHA" ]; then
            echo "::error::APK certificate does not match the release keystore. KEYSTORE_BASE64 holds a different keystore than the one that signed this APK — upload the matching .jks as the secret."
            exit 1
          fi
          echo "APK is signed by the release keystore ($RELEASE_SHA)"

          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::warning::aapt2 not found in the Android SDK; skipping the versionName check"
          fi
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK")
            echo "$BADGING" | head -1
            APK_NAME=$(echo "$BADGING" | head -1 | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            APK_CODE=$(echo "$BADGING" | head -1 | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            echo "apk versionName: '$APK_NAME' (expected '$VERSION_NAME')"
            echo "apk versionCode: '$APK_CODE' (expected '$VERSION_CODE')"
            if [ "$APK_NAME" != "$VERSION_NAME" ]; then
              echo "::error::APK versionName is '$APK_NAME' but this run is $VERSION_NAME."
              exit 1
            fi
            if [ -n "$VERSION_CODE" ] && [ "$APK_CODE" != "$VERSION_CODE" ]; then
              echo "::error::APK versionCode is '$APK_CODE' but this run is $VERSION_CODE."
              exit 1
            fi
          fi

          cp "$APK" "melo-${{ inputs.tag }}.apk"
          ls -lh "melo-${{ inputs.tag }}.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: melo-${{ inputs.tag }}
          path: mobile/melo-${{ inputs.tag }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: melo ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: mobile/melo-${{ inputs.tag }}.apk
          fail_on_unmatched_files: true