name: Desktop release

# Manually runnable: Actions -> "Desktop release" -> Run workflow.
# Also fires on v* tags, which is what the old tag-only workflow did.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 43.1.0 (blank = version in package.json)'
        required: false
        type: string
      tag:
        description: 'Release tag, e.g. v43.1.0 (blank = v<version>)'
        required: false
        type: string
      draft:
        description: 'Publish as a draft release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Never let electron-builder publish on its own; the release job owns that.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows 10/11 (x64)
            platform: win
            args: --win nsis --x64
          - os: ubuntu-latest
            label: Linux (x64)
            platform: linux
            args: --linux AppImage deb --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          node -e "console.log('building', require('./package.json').name, require('./package.json').version)"

      - name: Build installers
        shell: bash
        # unpacked dirs are useful for smoke tests but would double the artifact size
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const want = /\.(exe|AppImage|deb|msi|zip|dmg)$/i;
            const files = fs.readdirSync(".").filter((f) => want.test(f)).sort();
            if (!files.length) { console.error("no artifacts produced"); process.exit(1); }
            const lines = files.map((f) => {
              const h = crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
              const mb = (fs.statSync(f).size / 1048576).toFixed(2);
              console.log(`${f}  ${mb} MiB`);
              return `${h}  ${f}`;
            });
            fs.writeFileSync("SHA256SUMS-${{ matrix.platform }}.txt", lines.join("\n") + "\n");
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melo-${{ matrix.platform }}-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: melo-*
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -1
          # per-platform checksum files are merged into one manifest for the release
          shopt -s nullglob
          parts=(SHA256SUMS-*.txt)
          if [ ${#parts[@]} -eq 0 ]; then echo "no checksum files found"; exit 1; fi
          cat "${parts[@]}" | sort -k2 > ../SHA256SUMS-all.txt
          rm -f "${parts[@]}"
          cd ..
          if [ -s SHA256SUMS-all.txt ]; then mv SHA256SUMS-all.txt artifacts/SHA256SUMS.txt; fi

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: melo ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            melo desktop player ${{ steps.tag.outputs.tag }}

            - **Windows 10/11** — `melo-*-win-x64.exe` (NSIS installer)
            - **Linux** — `melo-*-linux-x64.AppImage` (portable) or `melo-*-linux-amd64.deb`

            Verify downloads against `SHA256SUMS.txt`.
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.yml
            artifacts/*.blockmap
            artifacts/SHA256SUMS.txt
