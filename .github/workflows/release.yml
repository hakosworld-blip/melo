name: melo release

# One pipeline for both platforms: the APK and the desktop installers are always
# built from the same commit and published in a single GitHub Release.
#
#   * push to main            -> signed APK + installers as artifacts (no release)
#   * push a tag like v1.0.1  -> one Release with the APK, both desktop installers
#                                and a combined SHA256SUMS.txt
#   * run manually            -> builds and releases both (tag defaults to v<version>)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       password for that key
#
# The keystore only ever exists as a temporary file on the runner; it is never
# committed, printed, cached or uploaded.

on:
  push:
    # Branch builds produce artifacts only. Before this, pushing code started no
    # build at all, which is why an existing (older) release looked unchanged.
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for both apps, e.g. 1.0.1 (blank = tag, or version in package.json)'
        required: false
        type: string
      tag:
        description: 'Release tag, e.g. v1.0.1 (blank = v<version>)'
        required: false
        type: string
      draft:
        description: 'Publish as a draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: melo-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Never let electron-builder publish on its own; the publish job owns that.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # A single resolved version feeds both platforms, so the APK, the installers and
  # the release tag can never disagree about what they contain.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version, tag and whether to publish
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A tag is the release: both platforms take their version from it.
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
          elif [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
            TAG="$INPUT_TAG"
            PUBLISH=true
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v$VERSION"
            PUBLISH=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run is a release request; default to the desktop version.
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v$VERSION"
            PUBLISH=true
          else
            # Branch build: not a release. Stamp the run number so the artifact and
            # the About screen identify exactly which commit produced them.
            VERSION="1.0.0-main.${GITHUB_RUN_NUMBER}"
            TAG=""
            PUBLISH=false
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error title=Bad version::'$VERSION' is not a valid version name (expected e.g. 1.0.1)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Resolved version $VERSION (tag '${TAG}', publish=$PUBLISH)"

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      apk: ${{ steps.verify.outputs.apk }}
      package: ${{ steps.verify.outputs.package }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets and keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/scripts/android-signing-preflight.sh validate

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/scripts/android-signing-preflight.sh prepare-signing

      - name: Build signed release APK
        working-directory: android
        env:
          MELO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MELO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MELO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MELO_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          MELO_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error title=No APK::assembleRelease produced no APK at $APK"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "::error title=Empty APK::The APK is zero bytes."
            exit 1
          fi
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Remove temporary keystore
        if: always()
        run: |
          if [ -n "${MELO_KEYSTORE_PATH:-}" ] && [ -f "$MELO_KEYSTORE_PATH" ]; then
            rm -f "$MELO_KEYSTORE_PATH"
            echo "Temporary keystore removed."
          fi

      - name: Verify signature, package id and checksum
        id: verify
        working-directory: android
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          echo "--- apksigner ---"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          if ! grep -q "^Verifies" /tmp/apksigner.txt; then
            echo "::error title=Bad signature::apksigner did not verify the APK."
            exit 1
          fi
          if grep -q "CN=Android Debug" /tmp/apksigner.txt; then
            echo "::error title=Wrong key::The APK was signed with a debug key."
            exit 1
          fi
          CERT_SHA256=$(grep "Signer #1 certificate SHA-256 digest" /tmp/apksigner.txt | awk '{print $NF}')
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

          echo "--- package ---"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VNAME=$(echo "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(echo "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
          if [ "$PKG" != "app.melo.player" ]; then
            echo "::error title=Wrong package::Expected app.melo.player but found '$PKG'."
            exit 1
          fi
          if [ "$VNAME" != "$VERSION_NAME" ]; then
            echo "::error title=Wrong version::APK says $VNAME but the build asked for $VERSION_NAME."
            exit 1
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

          OUT="melo-${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: melo-android
          path: |
            android/melo-${{ needs.prepare.outputs.version }}.apk
            android/melo-${{ needs.prepare.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows 10/11 (x64)
            platform: win
            args: --win nsis --x64
          - os: ubuntu-latest
            label: Linux (x64)
            platform: linux
            args: --linux AppImage deb --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Stamp version
        shell: bash
        # Both platforms report the same version; the release tag is derived from it.
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          WANTED="${{ needs.prepare.outputs.version }}"
          if [ "$CURRENT" != "$WANTED" ]; then
            npm version "$WANTED" --no-git-tag-version --allow-same-version >/dev/null
          fi
          node -e "console.log('building', require('./package.json').name, require('./package.json').version)"

      - name: Build installers
        shell: bash
        # unpacked dirs are useful for smoke tests but would double the artifact size
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const want = /\.(exe|AppImage|deb|msi|zip|dmg)$/i;
            const files = fs.readdirSync(".").filter((f) => want.test(f)).sort();
            if (!files.length) { console.error("no artifacts produced"); process.exit(1); }
            const lines = files.map((f) => {
              const h = crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
              const mb = (fs.statSync(f).size / 1048576).toFixed(2);
              console.log(`${f}  ${mb} MiB`);
              return `${h}  ${f}`;
            });
            fs.writeFileSync("SHA256SUMS-${{ matrix.platform }}.txt", lines.join("\n") + "\n");
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melo-${{ matrix.platform }}-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt

  publish:
    name: Publish release
    needs: [prepare, android, desktop]
    # Branch pushes stop here: an artifact-only build must never touch Releases.
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: melo-android
          path: artifacts

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: melo-*-x64
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -1
          # Per-platform checksum files and the APK checksum become one manifest.
          shopt -s nullglob
          parts=(SHA256SUMS-*.txt *.apk.sha256)
          if [ ${#parts[@]} -eq 0 ]; then echo "no checksum files found"; exit 1; fi
          cat "${parts[@]}" | sort -k2 > ../SHA256SUMS.txt
          rm -f "${parts[@]}"
          cd ..
          mv SHA256SUMS.txt artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: melo ${{ needs.prepare.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            **melo ${{ needs.prepare.outputs.version }}** — Android player and desktop app, built from the same commit.

            | Platform | File | Install |
            |---|---|---|
            | Android 8.0+ | `melo-${{ needs.prepare.outputs.version }}.apk` | open on the phone, allow installing from this source |
            | Windows 10/11 x64 | `melo-*-win-x64.exe` | run the NSIS installer |
            | Linux x64 | `melo-*-linux-x64.AppImage` | portable, `chmod +x` and run |
            | Debian/Ubuntu | `melo-*-linux-amd64.deb` | `sudo apt install ./melo-*.deb` |

            Verify downloads against `SHA256SUMS.txt` (includes the APK):

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            | | |
            |---|---|
            | Package | `${{ needs.android.outputs.package }}` |
            | APK signing cert SHA-256 | `${{ needs.android.outputs.cert_sha256 }}` |
            | Build | `${{ github.sha }}` |

            Allow notifications on Android so playback controls appear on the lock screen.
            Keep the same signing key for every release so updates install over older versions.

            melo plays public catalog streams (YouTube Music, SoundCloud) and reads
            metadata from iTunes/Deezer and lyrics from LRCLIB/NetEase. It is not
            affiliated with any of those services.
          files: |
            artifacts/*.apk
            artifacts/*.sha256
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.yml
            artifacts/*.blockmap
            artifacts/SHA256SUMS.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## melo ${{ needs.prepare.outputs.version }}"
            echo ""
            echo "- Tag: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- APK: \`${{ needs.android.outputs.apk }}\`"
            echo "- Package: \`${{ needs.android.outputs.package }}\`"
            echo "- APK signing cert SHA-256: \`${{ needs.android.outputs.cert_sha256 }}\`"
            echo "- Desktop: Windows x64 + Linux x64 installers"
          } >> "$GITHUB_STEP_SUMMARY"
