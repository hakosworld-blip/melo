name: Release

# One run builds both platforms so the APK and the installers always come from the
# same commit. Versions and releases stay separate, as they were before the merge:
#
#   Android  - version comes from release_tag/version_name or the pushed tag
#              (branch builds: 1.0.0-main.<run>). Its own Release.
#   Desktop  - version comes from the `version` input or package.json (43.x).
#              Its own Release at v<version>.
#
# What each trigger does:
#
#   * push to main        -> both builds uploaded as workflow artifacts, no releases
#   * push a tag like v*  -> both publish, each to its own tag/Release
#   * run manually        -> builds as artifacts; pass release_tag and/or tag to publish
#
# Both platforms share one trigger and one run, so they are released together whenever
# a run is a release run. They do not share a version number or a release page.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       password for that key
#
# The keystore only ever exists as a temporary file on the runner; it is never
# committed, printed, cached or uploaded.

on:
  push:
    # A push to main builds and uploads artifacts for both platforms. It deliberately
    # does NOT publish: the Android release step needs a non-empty release_tag, and the
    # desktop release job is skipped for branch pushes. Only a tag or a dispatch that
    # names a tag touches the Releases page.
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name (e.g. 1.0.1). Defaults to the tag, or 1.0.0-main.<run>.'
        required: false
        type: string
      release_tag:
        description: 'Optional: publish the Android Release with this tag (e.g. android-v1.0.1).'
        required: false
        type: string
      version:
        description: 'Desktop version to build, e.g. 43.1.0 (blank = version in package.json)'
        required: false
        type: string
      tag:
        description: 'Desktop release tag, e.g. v43.1.0 (blank = v<desktop version>)'
        required: false
        type: string
      draft:
        description: 'Publish the desktop release as a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: melo-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Never let electron-builder publish on its own; the release job owns that.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # ---------------------------------------------------------------------------
  # Android: signed APK + the Android Release
  # ---------------------------------------------------------------------------
  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets and keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/scripts/android-signing-preflight.sh validate

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            NAME="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            NAME="${REF_NAME#v}"
          else
            # Branch builds are not releases; stamp the run number so the artifact and
            # the About screen identify exactly which commit produced them.
            NAME="1.0.0-main.${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error title=Bad version::'$NAME' is not a valid version name (expected e.g. 1.0.0)."
            exit 1
          fi
          # Android refuses to install a versionCode lower than the installed one, so this
          # number must rise forever. github.run_number does not: it restarts whenever the
          # workflow file is recreated, and the merged pipeline did exactly that, dropping
          # to 3 while 16 and 17 had already shipped - every new APK was rejected as a
          # downgrade. Minutes since 2020-01-01 only ever goes up and still fits int32.
          CODE=$(( ( $(date -u +%s) - 1577836800 ) / 60 ))
          if [ "$CODE" -le 0 ] || [ "$CODE" -gt 2100000000 ]; then
            echo "::error title=Bad version code::Computed versionCode $CODE is outside the 1..2100000000 range Android accepts."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "release_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "Building melo $NAME (code ${CODE})"

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melo-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/scripts/android-signing-preflight.sh prepare-signing

      - name: Build signed release APK
        working-directory: android
        env:
          MELO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MELO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MELO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MELO_VERSION_NAME: ${{ steps.version.outputs.name }}
          MELO_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error title=No APK::assembleRelease produced no APK at $APK"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "::error title=Empty APK::The APK is zero bytes."
            exit 1
          fi
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Remove temporary keystore
        if: always()
        run: |
          if [ -n "${MELO_KEYSTORE_PATH:-}" ] && [ -f "$MELO_KEYSTORE_PATH" ]; then
            rm -f "$MELO_KEYSTORE_PATH"
            echo "Temporary keystore removed."
          fi

      - name: Verify signature, package id and checksum
        id: verify
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          echo "--- apksigner ---"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          if ! grep -q "^Verifies" /tmp/apksigner.txt; then
            echo "::error title=Bad signature::apksigner did not verify the APK."
            exit 1
          fi
          if grep -q "CN=Android Debug" /tmp/apksigner.txt; then
            echo "::error title=Wrong key::The APK was signed with a debug key."
            exit 1
          fi
          CERT_SHA256=$(grep "Signer #1 certificate SHA-256 digest" /tmp/apksigner.txt | awk '{print $NF}')
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

          echo "--- package ---"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VNAME=$(echo "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(echo "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
          if [ "$PKG" != "app.melo.player" ]; then
            echo "::error title=Wrong package::Expected app.melo.player but found '$PKG'."
            exit 1
          fi
          if [ "$VNAME" != "$VERSION_NAME" ]; then
            echo "::error title=Wrong version::APK says $VNAME but the build asked for $VERSION_NAME."
            exit 1
          fi
          if [ "$VCODE" != "$VERSION_CODE" ]; then
            echo "::error title=Wrong version code::APK says $VCODE but the build asked for $VERSION_CODE; it would not install over the current app."
            exit 1
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

          OUT="melo-${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: melo-${{ steps.version.outputs.name }}
          path: |
            android/melo-${{ steps.version.outputs.name }}.apk
            android/melo-${{ steps.version.outputs.name }}.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.version.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: melo ${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            **melo ${{ steps.version.outputs.name }}** — Android music player

            | | |
            |---|---|
            | Package | `${{ steps.verify.outputs.package }}` |
            | Version | `${{ steps.verify.outputs.version_name }}` (code `${{ steps.verify.outputs.version_code }}`) |
            | Minimum Android | 8.0 (API 26) |
            | Commit | `${{ github.sha }}` |
            | Signing cert SHA-256 | `${{ steps.verify.outputs.cert_sha256 }}` |

            **Install**

            1. Download the `.apk` below.
            2. Open it on the phone and allow installing from this source when prompted.
            3. Allow notifications so the playback controls appear on the lock screen.

            **Verify the download**

            ```
            sha256sum -c melo-${{ steps.version.outputs.name }}.apk.sha256
            ```

            Builds are reproducible from source with `android/gradlew assembleRelease`.
            Keep the same signing key for every release so updates install over older
            versions.

            melo plays public catalog streams (YouTube Music, SoundCloud) and reads
            metadata from iTunes/Deezer and lyrics from LRCLIB/NetEase. It is not
            affiliated with any of those services.
          files: |
            android/melo-${{ steps.version.outputs.name }}.apk
            android/melo-${{ steps.version.outputs.name }}.apk.sha256

      - name: Job summary
        if: always()
        run: |
          {
            echo "## melo ${{ steps.version.outputs.name }}"
            echo ""
            echo "- APK: \`${{ steps.verify.outputs.apk }}\`"
            echo "- Package: \`${{ steps.verify.outputs.package }}\`"
            echo "- Signing cert SHA-256: \`${{ steps.verify.outputs.cert_sha256 }}\`"
            echo "- Release tag: \`${{ steps.version.outputs.release_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Desktop: Windows + Linux installers
  # ---------------------------------------------------------------------------
  desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows 10/11 (x64)
            platform: win
            args: --win nsis --x64
          - os: ubuntu-latest
            label: Linux (x64)
            platform: linux
            args: --linux AppImage deb --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          node -e "console.log('building', require('./package.json').name, require('./package.json').version)"

      - name: Build installers
        shell: bash
        # unpacked dirs are useful for smoke tests but would double the artifact size
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const want = /\.(exe|AppImage|deb|msi|zip|dmg)$/i;
            const files = fs.readdirSync(".").filter((f) => want.test(f)).sort();
            if (!files.length) { console.error("no artifacts produced"); process.exit(1); }
            const lines = files.map((f) => {
              const h = crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
              const mb = (fs.statSync(f).size / 1048576).toFixed(2);
              console.log(`${f}  ${mb} MiB`);
              return `${h}  ${f}`;
            });
            fs.writeFileSync("SHA256SUMS-${{ matrix.platform }}.txt", lines.join("\n") + "\n");
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melo-${{ matrix.platform }}-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt

  desktop-release:
    name: Publish desktop release
    if: github.event_name != 'push' || github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: melo-*-x64
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -1
          # per-platform checksum files are merged into one manifest for the release
          shopt -s nullglob
          parts=(SHA256SUMS-*.txt)
          if [ ${#parts[@]} -eq 0 ]; then echo "no checksum files found"; exit 1; fi
          cat "${parts[@]}" | sort -k2 > ../SHA256SUMS-all.txt
          rm -f "${parts[@]}"
          cd ..
          if [ -s SHA256SUMS-all.txt ]; then mv SHA256SUMS-all.txt artifacts/SHA256SUMS.txt; fi

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag}"

      # The two platforms keep separate releases. If both would land on the same tag this
      # run would silently merge the APK into the desktop release, so stop instead and ask
      # for distinct tags.
      - name: Keep the desktop release separate from the Android release
        shell: bash
        env:
          DESKTOP_TAG: ${{ steps.tag.outputs.tag }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            ANDROID_TAG="$REF_NAME"
          else
            ANDROID_TAG="$INPUT_TAG"
          fi
          if [ -n "$ANDROID_TAG" ] && [ "$ANDROID_TAG" = "$DESKTOP_TAG" ]; then
            echo "::error title=One tag, two platforms::Desktop would publish '$DESKTOP_TAG', which this run also uses for the Android Release, so both would end up on one release. Pass a different desktop 'tag' input or a different Android 'release_tag'."
            exit 1
          fi
          echo "Desktop release tag '$DESKTOP_TAG' (Android tag '${ANDROID_TAG:-none}')"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: melo ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            melo desktop player ${{ steps.tag.outputs.tag }}

            - **Windows 10/11** — `melo-*-win-x64.exe` (NSIS installer)
            - **Linux** — `melo-*-linux-x64.AppImage` (portable) or `melo-*-linux-amd64.deb`

            Verify downloads against `SHA256SUMS.txt`.
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.yml
            artifacts/*.blockmap
            artifacts/SHA256SUMS.txt
