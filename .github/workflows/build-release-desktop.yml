name: Build · Release Desktop

# Desktop builds for Linux and Windows 10/11.
#
# - Run it manually with a tag, or let it run automatically when a release is
#   published by a person, so mobile and desktop share the same version and the
#   same GitHub Release.
# - If the release for that tag already exists, the built desktop files are
#   added to its existing assets instead of creating a second release.
#
# Note: GitHub does not start a workflow for events produced by another
# workflow's GITHUB_TOKEN, so a release created by the APK workflow will not
# auto-start this one. After such a release, run this workflow once with the
# same tag — the existing release receives the desktop files.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v1.0.0). An existing release gets the desktop assets added."
        required: true
        type: string
      prerelease:
        description: "Only used if the release does not exist yet"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag given." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' does not map to a semver version ('$VERSION'). Use a tag like v1.2.0." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building desktop $TAG (version $VERSION)"

  build:
    name: Package ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            platform: linux
            pattern: desktop/dist/*.AppImage
            artifact: desktop-linux
          - os: windows-latest
            label: Windows 10/11
            platform: win
            pattern: desktop/dist/*.exe
            artifact: desktop-windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Stamp version into the package manifest
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('desktop version', j.version);"

      - name: Typecheck the renderer and engine
        working-directory: desktop
        run: npm run typecheck

      - name: Build the renderer and the local engine
        working-directory: desktop
        run: npm run build

      - name: Package with electron-builder
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload packaged files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add assets to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ls -lh dist

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — adding desktop assets to it."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Release $TAG does not exist — creating it with the desktop assets."
            if [ "${PRERELEASE:-false}" = "true" ]; then
              gh release create "$TAG" dist/* --title "melo $TAG" --generate-notes --prerelease
            else
              gh release create "$TAG" dist/* --title "melo $TAG" --generate-notes
            fi
          fi

          gh release view "$TAG" --json tagName,assets --jq '.tagName + " assets: " + ([.assets[].name] | join(", "))'
